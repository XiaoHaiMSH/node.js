name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build packages (${{ matrix.platform_name }}, apk)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: ARM64
            release_tag: packages-arm64
            sdk_base: snapshots
            sdk_path: qualcommax/ipq60xx
            sdk_prefix: immortalwrt-sdk-qualcommax-ipq60xx_
            target: qualcommax
            subtarget: ipq60xx
          - platform_name: AMD64
            release_tag: packages-x86_64
            sdk_base: snapshots
            sdk_path: x86/64
            sdk_prefix: immortalwrt-sdk-x86-64_
            target: x86
            subtarget: '64'

    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/${{ matrix.sdk_base }}/targets/${{ matrix.sdk_path }}
      SDK_ARCHIVE_PREFIX: ${{ matrix.sdk_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig time unzip xsltproc zip zlib1g-dev zstd

      - name: Locate SDK
        id: sdk
        run: |
          sums_file="$RUNNER_TEMP/immortalwrt-sha256sums"
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o "$sums_file"

          archive=''
          sha256=''
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == "$SDK_ARCHIVE_PREFIX"*'.Linux-x86_64.tar.zst' ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < "$sums_file"

          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Download SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          archive="$RUNNER_TEMP/sdk/$SDK_ARCHIVE"

          curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive"
          echo "$SDK_SHA256  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/sdk-root"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/sdk-root"
          echo "SDK_ROOT=$(find "$RUNNER_TEMP/sdk-root" -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Load package list & extra feeds
        run: |
          strip() { sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$1" | grep -v '^$' || true; }
          valid='^[A-Za-z0-9._+-]+$'

          # packages.txt 每行: 目录名 [额外产出的包名 ...] [@feed名]
          : > "$RUNNER_TEMP/pkg-parsed"
          dirs=""
          pkgs=""
          while IFS= read -r line; do
            read -r -a tok <<< "$line"
            dir="${tok[0]}"
            feed=""
            names="$dir"
            [[ "$dir" =~ $valid ]] || { echo "包名不合法: $line"; exit 1; }
            for t in "${tok[@]:1}"; do
              if [[ "$t" == @* ]]; then
                feed="${t#@}"
                [[ "$feed" =~ $valid ]] || { echo "feed 名不合法: $line"; exit 1; }
              else
                [[ "$t" =~ $valid ]] || { echo "包名不合法: $line"; exit 1; }
                names="$names $t"
              fi
            done
            echo "$dir|$feed|$names" >> "$RUNNER_TEMP/pkg-parsed"
            dirs="$dirs $dir"
            pkgs="$pkgs $names"
          done < <(strip .github/packages.txt)

          [[ -n "${dirs// /}" ]] || { echo ".github/packages.txt 里没有任何包"; exit 1; }
          echo "DIRS=$dirs" >> "$GITHUB_ENV"
          echo "PKGS=$pkgs" >> "$GITHUB_ENV"
          echo "要编译的目录:$dirs"
          echo "要发布的包:$pkgs"

          # 外部 feed 追加在官方 feed 之后：没点名的同名包保持 OpenWrt 默认行为（官方优先）
          : > "$RUNNER_TEMP/extra-feeds"
          if [[ -f .github/feeds.txt ]]; then
            strip .github/feeds.txt > "$RUNNER_TEMP/extra-feeds"
          fi
          { cat "$SDK_ROOT/feeds.conf.default"; echo; cat "$RUNNER_TEMP/extra-feeds"; } > "$RUNNER_TEMP/feeds.new"
          mv "$RUNNER_TEMP/feeds.new" "$SDK_ROOT/feeds.conf.default"
          echo "---- feeds.conf.default ----"
          cat "$SDK_ROOT/feeds.conf.default"

      - name: Prepare packages
        run: |
          "$SDK_ROOT/scripts/feeds" update -a

          # 点名包的 feed 优先级：feeds.txt 里的外部 feed 在前（越靠上越优先），官方在后
          mapfile -t EXT_FEEDS < <(awk '$1 ~ /^src-/ { print $2 }' "$RUNNER_TEMP/extra-feeds")
          mapfile -t ALL_FEEDS < <(awk '$1 ~ /^src-/ { print $2 }' "$SDK_ROOT/feeds.conf.default")
          PRIORITY=("${EXT_FEEDS[@]}")
          for f in "${ALL_FEEDS[@]}"; do
            [[ " ${EXT_FEEDS[*]} " == *" $f "* ]] || PRIORITY+=("$f")
          done
          echo "点名包的 feed 优先级: ${PRIORITY[*]}"

          # 某个 feed 里所有叫 $2 的目录
          pkg_dirs() {
            [[ -d "$SDK_ROOT/feeds/$1" ]] || return 0
            find "$SDK_ROOT/feeds/$1/" -maxdepth 5 -type d -name "$2" -not -path '*/.git/*' | sort
          }

          echo "---- 多个 feed 里重名、且没写进 packages.txt 的包（按默认顺序处理，官方优先）----"
          find -L "$SDK_ROOT/feeds" -mindepth 3 -maxdepth 6 -name Makefile -not -path '*/.git/*' -print0 \
            | xargs -0 grep -lE 'rules\.mk|luci\.mk' 2>/dev/null \
            | sed "s#^$SDK_ROOT/feeds/##" \
            | awk -F/ -v skip=" $DIRS " '{ f=$1; p=$(NF-1); k=p SUBSEP f; if (!(k in s)) { s[k]=1; c[p]++; l[p]=l[p] " " f } } END { for (p in c) if (c[p]>1 && index(skip, " " p " ")==0) print p ":" l[p] }' \
            | sort || true
          echo "----"

          mapfile -t LINES < "$RUNNER_TEMP/pkg-parsed"
          for line in "${LINES[@]}"; do
            IFS='|' read -r p want_feed _ <<< "$line"

            # 1) 本仓库根目录有同名目录：最优先，替换所有 feed 里的同名包
            if [[ -f "$p/Makefile" ]]; then
              if [[ -n "$want_feed" ]]; then
                echo "$p: 本仓库已有，忽略 @$want_feed"
              fi

              dest=""
              while IFS= read -r d; do
                [[ -f "$d/Makefile" ]] || continue
                if [[ -z "$dest" ]]; then
                  dest="$d"
                else
                  rm -rf "$d"
                fi
              done < <(find "$SDK_ROOT/feeds" -maxdepth 5 -type d -name "$p" -not -path '*/.git/*')

              rm -rf "$SDK_ROOT/package/$p"

              if [[ -n "$dest" ]]; then
                echo "$p: 本仓库替换 ${dest#"$SDK_ROOT"/}"
                rm -rf "$dest"
                cp -a "$p" "$dest"
              else
                echo "$p: 官方没有，放进 package/"
                cp -a "$p" "$SDK_ROOT/package/$p"
              fi
              continue
            fi

            # 2) 本仓库没有：按 @feed 或优先级选一份，其余 feed 里的同名目录删掉
            order=("${PRIORITY[@]}")
            if [[ -n "$want_feed" ]]; then
              if [[ " ${ALL_FEEDS[*]} " != *" $want_feed "* ]]; then
                echo "$p: feed [$want_feed] 不存在，请检查 feeds.txt"
                exit 1
              fi
              order=("$want_feed")
            fi

            keep=""
            for f in "${order[@]}"; do
              while IFS= read -r d; do
                [[ -f "$d/Makefile" ]] || continue
                keep="$d"
                break
              done < <(pkg_dirs "$f" "$p")
              if [[ -n "$keep" ]]; then
                break
              fi
            done

            if [[ -z "$keep" ]]; then
              if [[ -n "$want_feed" ]]; then
                echo "$p: 指定的 feed [$want_feed] 里没有这个包"
                exit 1
              fi
              echo "$p: 所有 feed 里都没有，稍后会报找不到"
              continue
            fi

            echo "$p: 使用 ${keep#"$SDK_ROOT"/feeds/}"
            for f in "${PRIORITY[@]}"; do
              while IFS= read -r d; do
                [[ -f "$d/Makefile" ]] || continue
                if [[ "$d" != "$keep" ]]; then
                  echo "$p: 删除重名 ${d#"$SDK_ROOT"/feeds/}"
                  rm -rf "$d"
                fi
              done < <(pkg_dirs "$f" "$p")
            done
          done

          "$SDK_ROOT/scripts/feeds" update -a -i
          "$SDK_ROOT/scripts/feeds" install -a

          targets=""
          for p in $DIRS; do
            if [[ -d "$SDK_ROOT/package/$p" ]]; then
              t="package/$p"
            else
              t="$(cd "$SDK_ROOT" && find package/feeds -mindepth 2 -maxdepth 2 -name "$p" -print -quit)"
            fi
            [[ -n "$t" ]] || { echo "找不到 $p"; exit 1; }
            targets="$targets $t/compile"
          done
          echo "TARGETS=$targets" >> "$GITHUB_ENV"

      - name: Configure packages
        run: |
          {
            echo "CONFIG_TARGET_${{ matrix.target }}=y"
            echo "CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y"
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_DEVEL=y"
            echo "CONFIG_BUILD_LOG=y"
            for p in $PKGS; do
              echo "CONFIG_PACKAGE_${p}=m"
              case "$p" in
                luci-app-*) echo "CONFIG_PACKAGE_luci-i18n-${p#luci-app-}-zh-cn=m" ;;
              esac
            done
          } > "$SDK_ROOT/.config"

          make -C "$SDK_ROOT" defconfig

      - name: Compile packages
        run: |
          make -C "$SDK_ROOT" -j"$(nproc)" $TARGETS || \
            make -C "$SDK_ROOT" -j1 $TARGETS V=s

      - name: Collect packages
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          declare -A found

          want="$PKGS"
          for p in $PKGS; do
            case "$p" in
              luci-app-*) want="$want luci-i18n-${p#luci-app-}-zh-cn" ;;
            esac
          done

          while IFS= read -r -d '' apk; do
            name="$("$SDK_ROOT/staging_dir/host/bin/apk" adbdump "$apk" | awk '/^  name: / { sub(/^  name: /, ""); print; exit }')"

            case " $want " in
              *" $name "*) ;;
              *) continue ;;
            esac

            cp -p "$apk" "$RUNNER_TEMP/output/"
            found[$name]=1
          done < <(find "$SDK_ROOT/bin" -type f -name '*.apk' -print0)

          for p in $PKGS; do
            [[ -n "${found[$p]:-}" ]] || { echo "missing package: $p"; exit 1; }
          done

          ls -l "$RUNNER_TEMP/output"

      - name: Generate index
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          cd "$RUNNER_TEMP/output"
          apk_bin="$SDK_ROOT/staging_dir/host/bin/apk"

          if [[ -n "$APK_PRIVATE_KEY" ]]; then
            echo "检测到 APK_PRIVATE_KEY，生成签名索引"
            key="$RUNNER_TEMP/private-key.pem"
            printf '%s\n' "$APK_PRIVATE_KEY" > "$key"
            chmod 600 "$key"

            "$apk_bin" mkndx --allow-untrusted --sign "$key" --output packages.adb *.apk

            openssl ec -in "$key" -pubout -out public-key.pem
            rm -f "$key"
          else
            echo "未设置 APK_PRIVATE_KEY，生成未签名索引"
            "$apk_bin" mkndx --allow-untrusted --output packages.adb *.apk
          fi

          ls -l

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.release_tag }}
          TITLE: Packages apk (${{ matrix.platform_name }})
        run: |
          git -C "$GITHUB_WORKSPACE" log -1 --pretty=%B > "$RUNNER_TEMP/release_notes.txt"

          cd "$RUNNER_TEMP/output"

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/release_notes.txt" \
            -- *
